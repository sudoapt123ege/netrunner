name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev ccache

      - name: Install buildozer
        run: |
          python3 -m pip install --upgrade pip
          pip3 install --upgrade buildozer "cython<3.0" virtualenv

      - name: Fetch pygame-ce recipe
        run: |
          mkdir -p p4a-recipes/pygame-ce
          curl -fsSL https://gist.githubusercontent.com/emersonmx/c5bba202506e3c3d2d828ad278a8d5fe/raw/pygame-ce-recipe.py \
            -o p4a-recipes/pygame-ce/__init__.py
          python3 -c "import ast; ast.parse(open('p4a-recipes/pygame-ce/__init__.py').read())"
          echo "pygame-ce recipe fetched and validated"

      - name: Cache Buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Show last 100 lines if build failed
        if: failure()
        run: tail -100 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netrunner-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
